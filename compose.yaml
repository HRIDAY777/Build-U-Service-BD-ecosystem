services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uservice}
      POSTGRES_USER: ${POSTGRES_USER:-uservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: ["private_media:/app/media", "static_files:/app/staticfiles"]
    restart: unless-stopped
  worker:
    build: ./backend
    command: celery -A config worker -l INFO --concurrency=2
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: ["private_media:/app/media"]
    restart: unless-stopped
  beat:
    build: ./backend
    command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule
    env_file: .env
    depends_on: [worker]
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: https://www.uservicebd.com
    depends_on: [backend]
    restart: unless-stopped
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "static_files:/static:ro"]
    depends_on: [frontend, backend]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  private_media:
  static_files:
